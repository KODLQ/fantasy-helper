version: 1

ci:
  command: ./scripts/validate-openspec-portfolio
  order:
    - fpl-research-assistant-foundation
    - technical-debt-foundation
    - fpl-public-data-warehouse
    - fpl-multi-season-navigation
    - reusable-data-table
    - local-user-authentication
    - fpl-manager-league-sync
    - fpl-league-gameweek-insights
    - fpl-transfer-fixture-research
    - fpl-recommendation-evaluation
    - fpl-live-alerts-storyline
    - fpl-analysis-workbench
    - fpl-optimal-team-learning
  checks:
    - dependency-registry-schema
    - unknown-change-references
    - dependency-cycle-detection
    - dependency-release-order
    - one-authoritative-owner-per-capability
    - no-parent-child-spec-duplicates
    - openspec-validate-strict

# Canonical delivery dependencies. Production and integration implementation
# may not start until every change listed in `dependsOn` has passed its release
# gate. Planning-only governance tasks may be completed earlier so they can
# define ownership and the delivery graph they govern.
changes:
  fpl-research-assistant-foundation:
    owner: fpl-research-assistant-foundation
    authoritativeCapabilities: [repository-runtime, common-api-foundation, browser-foundation]
    dependsOn: []
    reason: Base repository, runtime, API, database, and browser-test contracts.
  technical-debt-foundation:
    owner: technical-debt-foundation
    authoritativeCapabilities: [frontend-maintainability, verification-operational-hygiene]
    dependsOn:
      - fpl-research-assistant-foundation
    reason: Frontend and verification maintenance builds on the foundation only.
  fpl-public-data-warehouse:
    owner: fpl-public-data-warehouse
    authoritativeCapabilities: [fpl-public-data-warehouse, common-response-contract, fpl-source-contract]
    dependsOn:
      - fpl-research-assistant-foundation
    reason: Durable public source, snapshot, migration, and common-response contracts.
  fpl-multi-season-navigation:
    owner: fpl-multi-season-navigation
    authoritativeCapabilities: [multi-season-navigation]
    dependsOn:
      - fpl-public-data-warehouse
    reason: Season discovery and selection require durable season-scoped warehouse identities and freshness metadata.
  reusable-data-table:
    owner: reusable-data-table
    authoritativeCapabilities: [reusable-data-table]
    dependsOn:
      - fpl-research-assistant-foundation
      - fpl-public-data-warehouse
    reason: Shared controlled table behavior builds on the frontend foundation and paginated warehouse query contract.
  local-user-authentication:
    owner: local-user-authentication
    authoritativeCapabilities: [local-user-authentication, user-workspace-ownership]
    dependsOn:
      - fpl-research-assistant-foundation
      - fpl-public-data-warehouse
    reason: Auth uses the common response contract and protects warehouse-backed private workspaces.
  fpl-manager-league-sync:
    owner: fpl-manager-league-sync
    authoritativeCapabilities: [fpl-manager-data-sync, fpl-league-data-sync, fpl-squad-import, league-team-comparison]
    dependsOn:
      - fpl-research-assistant-foundation
      - fpl-public-data-warehouse
      - fpl-multi-season-navigation
      - local-user-authentication
    reason: Manager and league facts require public identities plus authenticated user ownership.
  fpl-analysis-workbench:
    owner: fpl-analysis-workbench
    authoritativeCapabilities: [analysis-workbench-roadmap]
    dependsOn:
      - fpl-public-data-warehouse
      - local-user-authentication
      - fpl-manager-league-sync
      - fpl-league-gameweek-insights
      - fpl-transfer-fixture-research
      - fpl-recommendation-evaluation
      - fpl-live-alerts-storyline
    reason: Final cross-workbench compatibility, navigation, handoff, accessibility, and release gates run after all authoritative analysis children.
  fpl-league-gameweek-insights:
    owner: fpl-league-gameweek-insights
    authoritativeCapabilities: [league-intelligence, gameweek-autopsy]
    dependsOn:
      - fpl-public-data-warehouse
      - local-user-authentication
      - fpl-manager-league-sync
    reason: League and autopsy analysis consumes manager picks and public gameweek facts.
  fpl-transfer-fixture-research:
    owner: fpl-transfer-fixture-research
    authoritativeCapabilities: [transfer-laboratory, fixture-differential-research]
    dependsOn:
      - fpl-public-data-warehouse
      - local-user-authentication
      - fpl-manager-league-sync
    reason: Transfer simulations require owned squad snapshots and historical public prices/fixtures.
  fpl-recommendation-evaluation:
    owner: fpl-recommendation-evaluation
    authoritativeCapabilities: [recommendation-evaluation]
    dependsOn:
      - fpl-public-data-warehouse
      - local-user-authentication
      - fpl-manager-league-sync
    reason: Replay requires versioned public inputs, manager outcomes, and authenticated result ownership.
  fpl-live-alerts-storyline:
    owner: fpl-live-alerts-storyline
    authoritativeCapabilities: [live-gameweek-center, analysis-alerts, season-storyline]
    dependsOn:
      - fpl-public-data-warehouse
      - local-user-authentication
      - fpl-manager-league-sync
    reason: Live and storyline views require current snapshots, manager history, and user-owned alerts.
  fpl-optimal-team-learning:
    owner: fpl-optimal-team-learning
    authoritativeCapabilities: [optimal-team-learning]
    dependsOn:
      - fpl-analysis-workbench
      - fpl-public-data-warehouse
      - local-user-authentication
      - fpl-manager-league-sync
    reason: Retrospective optimization consumes the finalized shared analysis, warehouse, manager, and ownership contracts.
