services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fantasy_helper}
      POSTGRES_USER: ${POSTGRES_USER:-fantasy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fantasy}
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - fantasy-helper-db:/var/lib/postgresql/data
      - ./db:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-fantasy} -d $${POSTGRES_DB:-fantasy_helper}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-fantasy}:${POSTGRES_PASSWORD:-fantasy}@db:5432/${POSTGRES_DB:-fantasy_helper}?sslmode=disable
      FPL_BASE_URL: ${FPL_BASE_URL:-https://fantasy.premierleague.com/api}
      FPL_SOURCE_SEASON_ID: ${FPL_SOURCE_SEASON_ID:-}
      FPL_SOURCE_SEASON_NAME: ${FPL_SOURCE_SEASON_NAME:-}
      FPL_SOURCE_SEASON_DISCOVERY: ${FPL_SOURCE_SEASON_DISCOVERY:-true}
      FPL_SOURCE_PROFILES_JSON: ${FPL_SOURCE_PROFILES_JSON:-}
      FPL_SOURCE_TIMEOUT: ${FPL_SOURCE_TIMEOUT:-20s}
      FPL_SOURCE_RETRIES: ${FPL_SOURCE_RETRIES:-2}
      FPL_SOURCE_RETRY_JITTER: ${FPL_SOURCE_RETRY_JITTER:-100ms}
      FPL_SOURCE_MAX_CONCURRENT: ${FPL_SOURCE_MAX_CONCURRENT:-6}
      SYNC_WORKERS: ${SYNC_WORKERS:-6}
      SYNC_SCHEDULER_ENABLED: ${SYNC_SCHEDULER_ENABLED:-false}
      SYNC_SCHEDULER_TICK: ${SYNC_SCHEDULER_TICK:-1m}
      SYNC_CATALOG_CADENCE: ${SYNC_CATALOG_CADENCE:-1h}
      SYNC_FIXTURE_CADENCE: ${SYNC_FIXTURE_CADENCE:-1h}
      SYNC_LIVE_CADENCE: ${SYNC_LIVE_CADENCE:-5m}
      SYNC_FINALIZATION_CADENCE: ${SYNC_FINALIZATION_CADENCE:-15m}
      SYNC_RECONCILE_CADENCE: ${SYNC_RECONCILE_CADENCE:-24h}
      RETENTION_CLEANUP_ENABLED: ${RETENTION_CLEANUP_ENABLED:-false}
      RETENTION_CLEANUP_CADENCE: ${RETENTION_CLEANUP_CADENCE:-24h}
      RAW_PAYLOAD_RETENTION: ${RAW_PAYLOAD_RETENTION:-2160h}
      LIVE_PAYLOAD_RETENTION: ${LIVE_PAYLOAD_RETENTION:-720h}
      BACKEND_PORT: 8080
      APP_ENV: ${APP_ENV:-local}
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    volumes:
      - ./backend:/workspace
    working_dir: /workspace
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 15

  migrate:
    image: postgres:16-alpine
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-fantasy}:${POSTGRES_PASSWORD:-fantasy}@db:5432/${POSTGRES_DB:-fantasy_helper}
    volumes:
      - ./db:/migrations:ro
    command: ["sh", "/migrations/migrate.sh"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - fantasy-helper-frontend-node-modules:/app/node_modules
    working_dir: /app
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:5173 >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  fantasy-helper-db:
    name: fantasy-helper-${DEPLOY_ENV:-local}-db
  fantasy-helper-frontend-node-modules:
    name: fantasy-helper-${DEPLOY_ENV:-local}-frontend-node-modules
