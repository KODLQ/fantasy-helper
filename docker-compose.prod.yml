services:
  db:
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    volumes: !reset []
    working_dir: /app

  frontend:
    build:
      context: ./frontend
      target: runtime
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
    environment: !reset []
    volumes: !reset []
    working_dir: /usr/share/nginx/html
    ports: !override
      - "${FRONTEND_HOST_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/ >/dev/null"]
